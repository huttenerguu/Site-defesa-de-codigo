<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Portal Tech</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="top"><span class="logo">Portal Tech</span><span>Informação e aprendizado</span><button
                class="menu-toggle" id="menuButton" aria-expanded="false" aria-controls="menu">☰ Menu</button></div>
    </header>
    <nav id="menu" aria-label="Menu principal"><a href="index.html">Início</a><a href="noticias.html">Notícias</a><a
            href="artigos.html">Artigos</a><a href="tutoriais.html">Tutoriais</a><a href="galeria.html">Galeria</a><a
            href="videos.html">Vídeos</a><a href="podcast.html">Podcast</a><a href="agenda.html">Agenda</a><a
            href="sobre.html">Sobre</a><a href="contato.html">Contato</a><a href="https://developer.mozilla.org/pt-BR/"
            target="_blank" rel="noopener noreferrer">MDN ↗</a></nav>
    <main class="wrap">
        <section class="panel">
            <h1>Contato</h1>
            <p>Preencha os campos para salvar sua mensagem localmente.</p>
            <form id="contactForm"><label for="name">Nome</label><input id="name" name="name" type="text" required
                    minlength="3" pattern="[A-Za-zÀ-ÿ ]{3,}" placeholder="Seu nome"><label
                    for="email">E-mail</label><input id="email" name="email" type="email" required
                    placeholder="nome@exemplo.com"><label for="topic">Assunto</label><select id="topic" name="topic"
                    required>
                    <option value="">Selecione</option>
                    <option>Dúvida</option>
                    <option>Sugestão</option>
                    <option>Outro</option>
                </select><label for="message">Mensagem</label><textarea id="message" name="message" required
                    minlength="10" placeholder="Escreva sua mensagem"></textarea><button type="submit">Salvar
                    mensagem</button></form>
            <p id="feedback" role="status"></p>
            <h2>Mensagens salvas</h2>
            <ul id="messages"></ul>
        </section>
    </main>
    <footer>
        <p>Portal Tech | Projeto acadêmico de Front-End</p><small>© 2026</small>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
